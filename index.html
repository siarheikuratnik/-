<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17181d">
<title>Стены + Расчёт материала</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#17181d;color:#e8eaf0;
    font:15px/1.4 Roboto,"Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #topSwitch{
    display:flex;align-items:center;gap:6px;flex-shrink:0;
    padding:1px 8px;padding-top:calc(1px + env(safe-area-inset-top));
    background:#1e2028;border-bottom:1px solid #2c2f3a;
  }
  #topSwitch .cur{
    font-weight:600;font-size:11px;color:#c3c8d4;line-height:1.2;
    flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #topSwitch button{
    border:1px solid #4a70c0;background:#35589f;color:#fff;
    border-radius:6px;padding:1px 8px;font-size:13px;line-height:1.2;
    cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  #topSwitch button:active{background:#3f66b5}
  #frames{flex:1;position:relative;min-height:0}
  #frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#17181d}
  #frames iframe.show{display:block}
</style>
</head>
<body>

<header id="topSwitch">
  <span class="cur" id="curLabel">🧱 Редактор стен</span>
  <button id="btnSwitch" title="Перейти в калькулятор">📐</button>
</header>

<div id="frames">
  <iframe id="frame-editor" title="Редактор стен"></iframe>
  <iframe id="frame-calc" title="Калькулятор материала"></iframe>
</div>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Редактор стен · мобильный</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #17181d; color: #e8eaf0;
    font: 15px/1.4 Roboto, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .dim { color: #8a90a2; }
  button { touch-action: manipulation; }
  #toolbar { display: flex; align-items: center; gap: 5px; padding: 2px 8px; background: #1e2028; border-bottom: 1px solid #2c2f3a; flex-shrink: 0; }
  .brand { font-weight: 700; font-size: 12px; line-height: 1.1; flex: 1; min-width: 0; }
  .stat { color: #9aa1b2; font-size: 10px; white-space: nowrap; }
  .stat b { color: #e8eaf0; font-size: 11px; }
  button { background: #2a2d38; border: 1px solid #3a3e4d; color: #dfe2ea; border-radius: 10px; cursor: pointer; font-size: 14px; }
  button:active { background: #343848; }
  .iconBtn { width: 24px; height: 24px; font-size: 13px; flex-shrink: 0; border-radius: 6px; }
  #center { position: relative; height: 46vh; height: 46dvh; min-height: 0; background: #14151a; flex-shrink: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .zoomCtrls { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .zoomCtrls button { width: 42px; height: 42px; font-size: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #zoomLbl { position: absolute; left: 8px; top: 8px; z-index: 5; background: rgba(30,32,40,.85); border: 1px solid #2c2f3a; border-radius: 7px; padding: 3px 9px; font-size: 11px; color: #aeb4c4; pointer-events: none; }
  #dimBtn { position: absolute; left: 8px; bottom: 8px; z-index: 5; background: rgba(30,32,40,.9); border: 1px solid #3a3e4d; border-radius: 9px; color: #8a90a2; padding: 7px 12px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #dimBtn.on { background: #35589f; border-color: #4a70c0; color: #fff; font-weight: 600; }
  #emptyMsg { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; text-align: center; color: #666c7d; font-size: 14px; padding: 20px; pointer-events: none; }
  #wallChips { display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0; padding: 8px 10px; background: #191b21; border-bottom: 1px solid #2c2f3a; scrollbar-width: none; }
  #wallChips::-webkit-scrollbar { display: none; }
  .wChip { flex: 0 0 auto; background: #23252e; border: 1px solid #3a3e4d; color: #dfe2ea; border-radius: 11px; padding: 7px 13px; text-align: left; min-height: 46px; }
  .wChip.sel { background: #263054; border-color: #4a70c0; }
  .wChip.add { border-style: dashed; }
  .wcName { font-weight: 700; font-size: 13.5px; display: block; }
  .wcInfo { font-size: 11px; color: #9aa1b2; display: block; margin-top: 1px; }
  .wChip.sel .wcInfo { color: #b9c6e8; }
  #vSplitter { height: 18px; flex-shrink: 0; cursor: row-resize; display: flex; align-items: center; justify-content: center; background: #191b21; border-top: 1px solid #2c2f3a; border-bottom: 1px solid #2c2f3a; touch-action: none; }
  #vSplitter .grip { width: 48px; height: 4px; border-radius: 2px; background: #4a5060; }
  #vSplitter:active .grip { background: #4a70c0; }
  #tabbar { display: flex; background: #1e2028; border-bottom: 1px solid #2c2f3a; flex-shrink: 0; }
  .tabBtn { flex: 1; padding: 11px 2px 9px; font-size: 13px; background: none; border: none; color: #8a90a2; border-bottom: 2px solid transparent; border-radius: 0; min-height: 44px; }
  .tabBtn.on { color: #fff; border-bottom-color: #4a70c0; background: #232736; font-weight: 600; }
  #content { flex: 1; overflow-y: auto; min-height: 0; padding: 10px 12px calc(14px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .tabPage { display: none; }
  .tabPage.show { display: block; }
  .panel { background: #1e2028; border: 1px solid #2c2f3a; border-radius: 13px; padding: 13px; margin-bottom: 10px; }
  .panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #8a90a2; margin-bottom: 10px; }
  .pGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pCell { margin-bottom: 10px; }
  .pGrid .pCell { margin-bottom: 0; }
  .pCell label { display: block; font-size: 11.5px; color: #9aa1b2; margin-bottom: 4px; }
  .pCell input { width: 100%; height: 44px; font-size: 16px; background: #14151b; border: 1px solid #3a3e4d; color: #fff; border-radius: 10px; padding: 0 11px; }
  .pCell input[type=number] { text-align: right; }
  .pCell input:focus { outline: none; border-color: #4a70c0; }
  .btnRow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btnRow button { flex: 1 1 auto; min-height: 44px; padding: 8px 12px; font-size: 13.5px; }
  button.danger { background: #4a2430; border-color: #7a3a4d; color: #ffb3c0; }
  button.danger:active { background: #5d2c3c; }
  .chipWrap { display: flex; flex-wrap: wrap; gap: 7px; }
  .chipBtn { background: #23252e; border: 1px solid #3a3e4d; color: #dfe2ea; border-radius: 9px; padding: 9px 12px; font-size: 13px; min-height: 42px; }
  .chipBtn.sel { background: #263054; border-color: #4a70c0; }
  .chipBtn.add { border-style: dashed; }
</style>
</head>
<body>
<header id="toolbar">
  <div class="brand">Редактор стен</div>
  <span class="stat">Стен <b id="stWalls">0</b></span>
  <span class="stat">Проёмов <b id="stOps">0</b></span>
  <button class="iconBtn" id="btnUndo" title="Откат">↩</button>
  <button class="iconBtn" id="btnSave" title="Сохранить">💾</button>
  <button class="iconBtn" id="btnOpen" title="Открыть">📂</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>
<section id="center">
  <canvas id="cv"></canvas>
  <div class="zoomCtrls"><button id="zoomIn">+</button><button id="zoomOut">−</button><button id="zoomFit" title="Вписать">⤢</button></div>
  <div id="zoomLbl">100%</div>
  <button id="dimBtn">Размеры</button>
  <div id="emptyMsg">Добавьте стену кнопкой «＋ стена»<br>или откройте JSON кнопкой 📂</div>
</section>
<div id="wallChips"></div>
<div id="vSplitter"><div class="grip"></div></div>
<nav id="tabbar">
  <button class="tabBtn on" data-tab="wall">Стена</button>
  <button class="tabBtn" data-tab="openings">Проёмы</button>
</nav>
<main id="content">
  <div class="tabPage show" data-page="wall">
    <section class="panel">
      <h3>Параметры стены</h3>
      <div id="wallEmpty" class="dim">Добавьте или выберите стену</div>
      <div id="wallForm" style="display:none">
        <div class="pCell"><label>Название</label><input type="text" id="wName" autocomplete="off"></div>
        <div class="pGrid">
          <div class="pCell"><label>Длина, мм</label><input type="number" id="wLen" inputmode="numeric" min="100"></div>
          <div class="pCell"><label>Высота, мм</label><input type="number" id="wHgt" inputmode="numeric" min="100"></div>
        </div>
        <div class="btnRow"><button id="btnMirror">🔄 Зеркалировать</button><button id="btnDelWall" class="danger">🗑 Удалить стену</button></div>
      </div>
    </section>
  </div>
  <div class="tabPage" data-page="openings">
    <section class="panel">
      <h3>Проёмы <span id="opWallName" class="dim"></span></h3>
      <div id="opChips" class="chipWrap"></div>
      <div id="opEditor" style="display:none">
        <div class="pGrid" style="margin-top:12px">
          <div class="pCell"><label>X (от левого края), мм</label><input type="number" id="oX" inputmode="numeric"></div>
          <div class="pCell"><label>Y (от низа стены), мм</label><input type="number" id="oY" inputmode="numeric"></div>
          <div class="pCell"><label>Ширина, мм</label><input type="number" id="oW" inputmode="numeric"></div>
          <div class="pCell"><label>Высота, мм</label><input type="number" id="oH" inputmode="numeric"></div>
        </div>
        <div class="btnRow"><button id="btnLock">🔒 Заблокировать</button><button id="btnAlignT">⬆ По верху</button><button id="btnAlignB">⬇ По низу</button><button id="btnDelOp" class="danger">🗑 Удалить</button></div>
      </div>
    </section>
  </div>
</main>
<script>
'use strict';
const DIM_ZOOM = 1.5;
const state = { walls: [], nextWallId: 1, nextOpeningId: 1, selWallId: null, selOpeningId: null, dimOn: false, view: { zoom: .1, fitZoom: .1, ox: 60, oy: 60 }, history: [], fileName: 'walls.json' };
const $ = id => document.getElementById(id);
const cv = $('cv');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const curWall = () => state.walls.find(w => w.id === state.selWallId) || null;
const curOpening = () => { const w = curWall(); return w ? (w.openings.find(o => o.id === state.selOpeningId) || null) : null; };
function dimsVisible() { if (state.dimOn) return true; return state.view.zoom / (state.view.fitZoom || 1) >= DIM_ZOOM; }
function snapshot() { return JSON.stringify({ walls: state.walls, nextWallId: state.nextWallId, nextOpeningId: state.nextOpeningId }); }
function pushHistory() { const s = snapshot(); if (state.history[state.history.length - 1] === s) return; state.history.push(s); if (state.history.length > 60) state.history.shift(); $('btnUndo').style.opacity = 1; }
function undo() { const s = state.history.pop(); if (!s) { updateUI(); return; } const d = JSON.parse(s); state.walls = d.walls; state.nextWallId = d.nextWallId; state.nextOpeningId = d.nextOpeningId; if (!curWall()) { state.selWallId = state.walls.length ? state.walls[0].id : null; state.selOpeningId = null; } else if (!curOpening()) state.selOpeningId = null; if (!state.history.length) $('btnUndo').style.opacity = .4; fitView(); updateUI(); }
$('btnUndo').onclick = undo;
function fitView() { const cw = cv.clientWidth || 360, ch = cv.clientHeight || 300; const w = curWall(); if (!w) { state.view = { zoom: .1, fitZoom: .1, ox: cw / 2, oy: ch / 2 }; return; } const mL = 560, mR = 320, mT = 190, mB = 540; const totalW = w.length + mL + mR, totalH = w.height + mT + mB; const pad = 26; const z = Math.max(.01, Math.min((cw - pad) / totalW, (ch - pad) / totalH)); state.view.zoom = z; state.view.fitZoom = z; state.view.ox = (cw - totalW * z) / 2 + mL * z; state.view.oy = (ch - totalH * z) / 2 + mT * z; }
function clampZoom(z) { const f = state.view.fitZoom || .1; return Math.max(f * .05, Math.min(f * 100, z)); }
function zoomAt(mx, my, f) { const v = state.view, nz = clampZoom(v.zoom * f), k = nz / v.zoom; v.ox = mx - (mx - v.ox) * k; v.oy = my - (my - v.oy) * k; v.zoom = nz; draw(); }
function toWorld(cx, cy) { const rc = cv.getBoundingClientRect(), v = state.view; return { x: (cx - rc.left - v.ox) / v.zoom, y: (cy - rc.top - v.oy) / v.zoom }; }
function draw() { const c = cv.getContext('2d'), dpr = window.devicePixelRatio || 1; const cw = cv.clientWidth, ch = cv.clientHeight; if (cv.width !== Math.round(cw * dpr) || cv.height !== Math.round(ch * dpr)) { cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); } c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = '#14151a'; c.fillRect(0, 0, cw, ch); const v = state.view; $('zoomLbl').textContent = Math.round(v.zoom / (v.fitZoom || 1) * 100) + '%'; const w = curWall(); $('emptyMsg').style.display = w ? 'none' : 'flex'; if (!w) return; drawGrid(c, cw, ch); const X = x => v.ox + x * v.zoom, Y = y => v.oy + y * v.zoom; drawWall(c, w, X, Y); if (dimsVisible()) drawDims(c, w, X, Y); }
function drawGrid(c, cw, ch) { const v = state.view; let step = 500; while (step * v.zoom < 24) step *= 2; c.strokeStyle = 'rgba(255,255,255,.045)'; c.lineWidth = 1; const wx0 = Math.floor((-v.ox / v.zoom) / step) * step, wx1 = (cw - v.ox) / v.zoom; for (let x = wx0; x <= wx1; x += step) { const sx = v.ox + x * v.zoom; c.beginPath(); c.moveTo(sx, 0); c.lineTo(sx, ch); c.stroke(); } const wy0 = Math.floor((-v.oy / v.zoom) / step) * step, wy1 = (ch - v.oy) / v.zoom; for (let y = wy0; y <= wy1; y += step) { const sy = v.oy + y * v.zoom; c.beginPath(); c.moveTo(0, sy); c.lineTo(cw, sy); c.stroke(); } }
function drawWall(c, w, X, Y) { const z = state.view.zoom; const x = X(0), y = Y(0), ww = w.length * z, hh = w.height * z; c.fillStyle = '#232530'; c.fillRect(x, y, ww, hh); for (const o of w.openings) drawOpening(c, w, o, X, Y); c.lineWidth = 2; c.strokeStyle = '#6a7080'; c.strokeRect(x + .5, y + .5, ww - 1, hh - 1); if (z > .02) { c.fillStyle = '#aeb4c4'; c.font = '12px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText(w.name + ' — ' + w.length + '×' + w.height, x + ww / 2, y - 8); } }
function drawOpening(c, w, o, X, Y) { const z = state.view.zoom; const ox = X(o.x), oy = Y(w.height - o.y - o.h); const ww = o.w * z, hh = o.h * z; const sel = o.id === state.selOpeningId; const showDims = dimsVisible(); c.fillStyle = 'rgba(10,11,15,.85)'; c.fillRect(ox, oy, ww, hh); c.save(); c.beginPath(); c.rect(ox, oy, ww, hh); c.clip(); c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1; for (let i = -hh; i < ww; i += 14) { c.beginPath(); c.moveTo(ox + i, oy + hh); c.lineTo(ox + i + hh, oy); c.stroke(); } c.restore(); if (sel) { c.strokeStyle = '#ffb84d'; c.lineWidth = 2.5; c.setLineDash([]); } else { c.strokeStyle = '#565b6b'; c.lineWidth = 1.2; c.setLineDash([5, 4]); } c.strokeRect(ox + .5, oy + .5, ww - 1, hh - 1); c.setLineDash([]); if (o.locked && ww > 20 && hh > 18) { c.font = '12px sans-serif'; c.textAlign = 'right'; c.textBaseline = 'top'; c.fillText('🔒', ox + ww - 4, oy + 3); } if (sel && !showDims && ww > 48 && hh > 16) { c.font = '11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeText(o.w + '×' + o.h, ox + ww / 2, oy + hh / 2); c.fillStyle = '#ffd9a0'; c.fillText(o.w + '×' + o.h, ox + ww / 2, oy + hh / 2); } }
const DIM_COL = '#8fa3c8', DIM_TXT = '#cfe0ff';
function dimText(c, label, sx, sy, major, rotate) { c.save(); c.translate(sx, sy); if (rotate) c.rotate(-Math.PI / 2); c.font = (major ? '12.5px' : '11px') + ' sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.72)'; c.strokeText(label, 0, 0); c.fillStyle = DIM_TXT; c.fillText(label, 0, 0); c.restore(); }
function dimH(c, x1, x2, yw, label, X, Y, major) { const sx1 = X(x1), sx2 = X(x2), sy = Y(yw); c.strokeStyle = DIM_COL; c.lineWidth = major ? 1.5 : 1; c.beginPath(); c.moveTo(sx1, sy); c.lineTo(sx2, sy); c.stroke(); c.beginPath(); c.moveTo(sx1, sy - 5); c.lineTo(sx1, sy + 5); c.moveTo(sx2, sy - 5); c.lineTo(sx2, sy + 5); c.stroke(); if (Math.abs(sx2 - sx1) > 26) dimText(c, label, (sx1 + sx2) / 2, sy - 9, major, false); }
function dimV(c, y1, y2, xw, label, X, Y, major) { const sy1 = Y(y1), sy2 = Y(y2), sx = X(xw); c.strokeStyle = DIM_COL; c.lineWidth = major ? 1.5 : 1; c.beginPath(); c.moveTo(sx, sy1); c.lineTo(sx, sy2); c.stroke(); c.beginPath(); c.moveTo(sx - 5, sy1); c.lineTo(sx + 5, sy1); c.moveTo(sx - 5, sy2); c.lineTo(sx + 5, sy2); c.stroke(); if (Math.abs(sy2 - sy1) > 26) dimText(c, label, sx - 10, (sy1 + sy2) / 2, major, true); }
function extLine(c, ax, ay, bx, by, X, Y) { c.strokeStyle = 'rgba(143,163,200,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(X(ax), Y(ay)); c.lineTo(X(bx), Y(by)); c.stroke(); }
function drawDims(c, w, X, Y) { const L = w.length, H = w.height; const ops = w.openings.slice().sort((a, b) => a.x - b.x); const yRow1 = H + 180, yTotal = H + 400; let curX = 0; const segs = []; for (const o of ops) { if (o.x > curX) segs.push([curX, o.x]); segs.push([o.x, o.x + o.w]); curX = o.x + o.w; } if (curX < L) segs.push([curX, L]); extLine(c, 0, H, 0, yTotal, X, Y); extLine(c, L, H, L, yTotal, X, Y); for (const o of ops) { extLine(c, o.x, H, o.x, yRow1, X, Y); extLine(c, o.x + o.w, H, o.x + o.w, yRow1, X, Y); } for (const s of segs) dimH(c, s[0], s[1], yRow1, String(s[1] - s[0]), X, Y, false); dimH(c, 0, L, yTotal, String(L), X, Y, true); extLine(c, L, 0, L + 220, 0, X, Y); extLine(c, L, H, L + 220, H, X, Y); dimV(c, 0, H, L + 200, String(H), X, Y, true); ops.forEach((o, i) => { const xDim = -180 - i * 150; const top = H - o.y - o.h; const bottom = H - o.y; extLine(c, o.x, top, xDim, top, X, Y); extLine(c, o.x, bottom, xDim, bottom, X, Y); if (top > 0) dimV(c, 0, top, xDim, String(top), X, Y, false); dimV(c, top, bottom, xDim, String(o.h), X, Y, false); if (o.y > 0) dimV(c, bottom, H, xDim, String(o.y), X, Y, false); }); }

  <div class="brand">Калькулятор материала<small>ряды · подрезка · замки</small></div>
  <div class="badgeBoards" id="boardsBadge">— досок</div>
  <button class="iconBtn" id="btnOpen" title="Открыть JSON">📂</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>
<section id="center">
  <canvas id="cv"></canvas>
  <div class="zoomCtrls"><button id="zoomIn">+</button><button id="zoomOut">−</button><button id="zoomFit" title="Вписать">⤢</button></div>
  <div id="zoomLbl">100%</div>
  <div id="legend">
    <span><i class="lg" style="background:#2e7d5b"></i>целая</span>
    <span><i class="lg" style="background:#c07a2e"></i>рез</span>
    <span><i class="lg" style="background:#6a5fc7"></i>обрезок</span>
    <span><i class="lg" style="background:#2e7d5b;border-left:3px solid #ff4d4d"></i>нач. замок</span>
    <span><i class="lg" style="background:#2e7d5b;border-right:3px solid #9be15d"></i>кон. замок</span>
  </div>
  <div id="emptyMsg">Откройте JSON из wall_editor<br>кнопкой 📂 сверху</div>
</section>
<div id="wallChips"></div>
<nav id="tabbar">
  <button class="tabBtn" data-tab="params">Параметры</button>
  <button class="tabBtn on" data-tab="summary">Итог</button>
  <button class="tabBtn" data-tab="rows">Ряды</button>
  <button class="tabBtn" data-tab="db">Обрезки</button>
  <button class="tabBtn" data-tab="legend">Легенда</button>
</nav>
<main id="content">
  <div class="tabPage" data-page="params" id="pageParams">
    <section class="panel">
      <h3>Заготовка и раскрой</h3>
      <div class="pGrid">
        <div class="pCell"><label>Длина, мм</label><input type="number" id="pL" value="1380" min="1" inputmode="numeric"></div>
        <div class="pCell"><label>Ширина, мм</label><input type="number" id="pW" value="192" min="1" inputmode="numeric"></div>
        <div class="pCell"><label>Мин. отрезок, мм</label><input type="number" id="pMinCut" value="200" min="0" inputmode="numeric"></div>
        <div class="pCell"><label>Мин. смещение, мм</label><input type="number" id="pMinOff" value="300" min="0" inputmode="numeric"></div>
        <div class="pCell"><label>Макс. смещение, мм</label><input type="number" id="pMaxOff" value="1080" min="0" inputmode="numeric"></div>
      </div>
      <div class="segRowM"><span class="lbl">Ориентация рядов</span><div class="segFull"><button id="oH" class="on">Горизонтально</button><button id="oV">Вертикально</button></div></div>
      <div class="segRowM"><span class="lbl">Ряды считать</span><div class="segFull"><button id="dH" class="on">Снизу</button><button id="dT">Сверху</button></div></div>
      <div id="dirNote"></div>
    </section>
  </div>
  <div class="tabPage show" data-page="summary"><section class="panel"><h3>Сводка</h3><div id="summary"><span class="dim">Нет данных</span></div></section></div>
  <div class="tabPage" data-page="rows"><section class="panel"><h3 id="detTitle">Детали по рядам</h3><div id="details"><span class="dim">Выберите стену</span></div></section></div>
  <div class="tabPage" data-page="db"><section class="panel"><h3>База отрезков</h3><div id="dbPanel"><span class="dim">—</span></div></section></div>
  <div class="tabPage" data-page="legend">
    <section class="panel"><h3>Куски в рядах</h3>
      <div class="lgRow"><span class="sw" style="background:#2e7d5b"></span><span class="txt">Целая заготовка (полная длина доски)</span></div>
      <div class="lgRow"><span class="sw" style="background:#c07a2e"></span><span class="txt">Рез из новой заготовки — значок ✂</span></div>
      <div class="lgRow"><span class="sw" style="background:#6a5fc7"></span><span class="txt">Кусок из обрезка базы (БД) — значок ♻</span></div>
      <div class="lgRow"><span class="sw" style="background:#7a4d1d;outline:2px solid #e05555"></span><span class="txt">Вынужденный короткий кусок — значок ⚠<div class="lgNote">Короче мин. отрезка, но без него ряд не закрыть (узкая перемычка между проёмами)</div></span></div>
    </section>
    <section class="panel"><h3>Замки (полоски на кромках кусков)</h3>
      <div class="lgRow"><span class="sw" style="background:#2e7d5b;border-left:4px solid #ff4d4d"></span><span class="txt"><b style="color:#ff6b6b">Красная</b> — начальный замок. Ставится только в конец ряда / подряда</span></div>
      <div class="lgRow"><span class="sw" style="background:#2e7d5b;border-right:4px solid #9be15d"></span><span class="txt"><b style="color:#9be15d">Салатовая</b> — конечный замок. Ставится только в начало ряда / подряда</span></div>
      <div class="lgRow"><span class="sw" style="background:#2e7d5b"></span><span class="txt">Без полоски — резаная кромка без замка</span></div>
      <div class="lgNote">Соединение возможно только «начальный + конечный». Кусок, резаный с двух сторон (без замков), используется только как единственный кусок короткого подряда. В вертикальной ориентации полоски на верхней и нижней кромке куска.</div>
    </section>
    <section class="panel"><h3>Элементы чертежа</h3>
      <div class="lgRow"><span class="sw swOp"></span><span class="txt">Проём — не закрывается материалом, размер указан в мм</span></div>
      <div class="lgRow"><span class="sw" style="background:#232530;border:1.5px solid #6a7080"></span><span class="txt">Стена с размерами по краям; тёмные линии между кусками — швы</span></div>
      <div class="lgNote">Размер в мм подписан на каждом куске; значки: ✂ рез из новой · ♻ из обрезка · ⚠ вынужденный.</div>
    </section>
    <section class="panel"><h3>Правила расчёта</h3>
      <div class="lgRow"><span class="txt">• Очередь 1 — стены без проёмов, длина ≤ длины заготовки<br>• Очередь 2 — стены без проёмов, длина &gt; длины заготовки<br>• Очередь 3 — стены с проёмами: ряд, пересекающий проём по всей высоте, делится на подряды; частичное пересечение считается целым рядом<br>• Последний неполный ряд считается как целый<br>• Смещение шва каждого ряда относительно предыдущего — в пределах мин.–макс. смещения<br>• Середина ряда — только целые заготовки; резаные куски — по краям ряда / подряда<br>• Каждый подряд проверяет перешивку независимо относительно первого шва предыдущего ряда</span></div>
    </section>
    <section class="panel"><h3>Показатели сводки</h3>
      <div class="lgRow"><span class="txt">• <b>Целые заготовки</b> — сколько новых досок израсходовано (главный результат)<br>• <b>Резы из новых</b> — куски, отрезанные от новых досок<br>• <b>Обрезков применено</b> — куски, взятые из базы остатков<br>• <b>Отходы</b> — остатки короче мин. отрезка<br>• <b>База отрезков</b> — нач. замок → конец ряда; кон. замок → начало ряда; без замков → короткие подряды</span></div>
    </section>
  </div>
</main>
<script>
'use strict';
const state = { walls: [], sel: -1, tab: 'summary', orientation: 'horiz', direction: 'bottom', result: null, view: { zoom: 1, fitZoom: 1, ox: 0, oy: 0 } };
const $ = id => document.getElementById(id);
const LOCK_S = '#ff4d4d', LOCK_E = '#9be15d';
const lockColor = k => k === 'S' ? LOCK_S : k === 'E' ? LOCK_E : null;
function loadJSON(text) { let data; try { data = JSON.parse(text); } catch (e) { alert('Ошибка JSON: ' + e.message); return; } let walls = Array.isArray(data) ? data : data.walls; if (!Array.isArray(walls)) { alert('В файле не найден массив walls'); return; } state.walls = walls.map((w, i) => ({ id: w.id ?? i, name: w.name || ('Стена ' + (i + 1)), length: +w.length || 0, height: +w.height || 0, openings: (w.openings || []).map(o => ({ x: +o.x || 0, y: +o.y || 0, w: +(o.w ?? o.width) || 0, h: +(o.h ?? o.height) || 0 })).filter(o => o.w > 0 && o.h > 0) })).filter(w => w.length > 0 && w.height > 0); state.sel = state.walls.length ? 0 : -1; recalc(); fitView(); }
function readFile(f) { const r = new FileReader(); r.onload = () => loadJSON(r.result); r.readAsText(f); }
$('btnOpen').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); e.target.value = ''; };
function getParams() { return { L: Math.max(1, +$('pL').value || 1380), W: Math.max(1, +$('pW').value || 192), minCut: Math.max(0, +$('pMinCut').value || 0), minOff: Math.max(0, +$('pMinOff').value || 0), maxOff: Math.max(0, +$('pMaxOff').value || 0) }; }
function transformWall(w, P) { let len, hgt, ops; if (P.orientation === 'vert') { len = w.height; hgt = w.length; ops = w.openings.map(o => ({ x: w.height - o.y - o.h, y: o.x, w: o.h, h: o.w, ow: o.w, oh: o.h })); } else { len = w.length; hgt = w.height; ops = w.openings.map(o => ({ x: o.x, y: w.height - o.y - o.h, w: o.w, h: o.h, ow: o.w, oh: o.h })); } ops = ops.map(o => { const x1 = Math.max(0, Math.min(len, o.x)), x2 = Math.max(0, Math.min(len, o.x + o.w)); const y1 = Math.max(0, Math.min(hgt, o.y)), y2 = Math.max(0, Math.min(hgt, o.y + o.h)); return { x: x1, y: y1, w: x2 - x1, h: y2 - y1, ow: o.ow, oh: o.oh }; }).filter(o => o.w > 0 && o.h > 0); return { id: w.id, name: w.name, origLen: w.length, origH: w.height, len, hgt, ops, res: null }; }
function recalc() { if (!state.walls.length) { state.result = null; updateUI(); return; } const P = Object.assign(getParams(), { orientation: state.orientation, direction: state.direction }); const ctx = { P, nextId: 1, db: { start: [], end: [], none: [] }, wholeUsed: 0, cutNew: 0, reused: 0, wasteCount: 0, wasteLen: 0 }; const tw = state.walls.map(w => transformWall(w, P)); const q1 = tw.filter(w => !w.ops.length && w.len <= P.L); const q2 = tw.filter(w => !w.ops.length && w.len > P.L); const q3 = tw.filter(w => w.ops.length > 0); for (const w of [...q1, ...q2, ...q3]) calcWall(w, ctx); state.result = { P, totalBoards: ctx.wholeUsed, cutNew: ctx.cutNew, reused: ctx.reused, wasteCount: ctx.wasteCount, wasteLen: Math.round(ctx.wasteLen), db: { start: ctx.db.start.map(p => p.len).sort((a, b) => b - a), end: ctx.db.end.map(p => p.len).sort((a, b) => b - a), none: ctx.db.none.map(p => p.len).sort((a, b) => b - a) }, walls: tw }; updateUI(); }

function calcWall(w, ctx) {
    const P = ctx.P;
    const rowsTotal = Math.max(1, Math.ceil(w.hgt / P.W - 1e-9));
    const wallRes = { queue: w.ops.length ? 3 : (w.len <= P.L ? 1 : 2), rows: [], boards0: ctx.wholeUsed, reuse0: ctx.reused, cut0: ctx.cutNew };
    let prevSeam = null;
    for (let i = 0; i < rowsTotal; i++) {
        let yTop, rowH;
        if (P.direction === 'bottom') { const yBot = w.hgt - i * P.W; yTop = Math.max(0, yBot - P.W); rowH = yBot - yTop; }
        else { yTop = i * P.W; rowH = Math.min(P.W, w.hgt - yTop); }
        if (rowH <= 0) continue;
        const cross = w.ops.filter(o => o.y <= yTop + 1e-9 && yTop + rowH <= o.y + o.h + 1e-9).slice().sort((a, b) => a.x - b.x);
        const segs = []; let cur = 0;
        for (const o of cross) {
            const ox1 = Math.max(0, o.x), ox2 = Math.min(w.len, o.x + o.w);
            if (ox2 <= ox1) continue;
            if (ox1 > cur) segs.push({ x1: cur, x2: ox1 });
            if (ox2 > cur) cur = ox2;
        }
        if (cur < w.len) segs.push({ x1: cur, x2: w.len });
        const row = { idx: i, yTop, rowH, subrows: [] };
        segs.forEach((sg, si) => {
            const D = sg.x2 - sg.x1;
            if (D <= 0) return;
            const sol = solveRow(D, prevSeam, ctx);
            row.subrows.push({ x1: sg.x1, x2: sg.x2, pieces: sol.pieces, firstSeam: sol.firstSeam });
        });
        prevSeam = null;
        for (const sr of row.subrows) if (sr.firstSeam != null) { prevSeam = sr.firstSeam; break; }
        wallRes.rows.push(row);
    }
    wallRes.boards = ctx.wholeUsed - wallRes.boards0;
    wallRes.reused = ctx.reused - wallRes.reuse0;
    wallRes.cutNew = ctx.cutNew - wallRes.cut0;
    w.res = wallRes;
}

function findBestRemnant(list, need) {
    let best = null;
    for (const p of list) {
        if (p.len < need) continue;
        if (!best || p.len > best.len) best = p;
    }
    return best;
}

function evaluateS(s, D, ctx) {
    const P = ctx.P;
    if (s < P.minCut || s > P.L || s > D) return null;
    const rem = D - s;
    const n = Math.floor(rem / P.L + 1e-9);
    const e = Math.round(rem - n * P.L);
    if (e > 0 && e < P.minCut) return null;
    if (e > P.L) return null;
    let boards = n, waste = 0, cuts = 0, reuse = 0, startSrc = null, endSrc = null;
    if (s < P.L) {
        cuts++;
        const p = findBestRemnant(ctx.db.end, s);
        if (p) { reuse++; const remS = p.len - s; if (remS > 0 && remS < P.minCut) waste += remS; startSrc = { type: 'db', piece: p }; }
        else { boards++; const remS = P.L - s; if (remS > 0 && remS < P.minCut) waste += remS; startSrc = { type: 'new' }; }
    }
    if (e > 0 && e < P.L) {
        cuts++;
        const p = findBestRemnant(ctx.db.start, e);
        if (p) { reuse++; const remE = p.len - e; if (remE > 0 && remE < P.minCut) waste += remE; endSrc = { type: 'db', piece: p }; }
        else { boards++; const remE = P.L - e; if (remE > 0 && remE < P.minCut) waste += remE; endSrc = { type: 'new' }; }
    }
    return { kind: 'sFam', s, boards, waste, cuts, reuse, startSrc, endSrc };
}

function pickS(sLo, sHi, D, prevSeam, ctx) {
    const P = ctx.P, set = new Set();
    const add = v => { v = Math.round(v); if (v >= sLo && v <= sHi) set.add(v); };
    add(sLo); add(sHi); add(P.L);
    if (prevSeam != null) for (const d of [P.minOff, P.maxOff, (P.minOff + P.maxOff) / 2]) { add(prevSeam + d); add(prevSeam - d); }
    for (const p of ctx.db.end) add(p.len);
    let best = null;
    for (const s0 of set) for (const s of projectValid(s0, sLo, sHi, prevSeam, P)) {
        const ev = evaluateS(s, D, ctx);
        if (ev && (!best || better(ev, best))) best = ev;
    }
    return best;
}

function projectValid(s, sLo, sHi, prevSeam, P) {
    const ok = x => prevSeam == null || (Math.abs(x - prevSeam) >= P.minOff - 1e-9 && Math.abs(x - prevSeam) <= P.maxOff + 1e-9);
    if (ok(s) || prevSeam == null) return [s];
    const out = new Set(); let any = false;
    const ivs = [[prevSeam - P.maxOff, prevSeam - P.minOff], [prevSeam + P.minOff, prevSeam + P.maxOff]];
    for (const iv of ivs) {
        const lo = Math.max(sLo, Math.ceil(iv[0])), hi = Math.min(sHi, Math.floor(iv[1]));
        if (lo <= hi) { any = true; out.add(Math.max(lo, Math.min(hi, s))); out.add(lo); out.add(hi); }
    }
    if (!any) out.add(s);
    return [...out];
}

function solveRow(D, prevSeam, ctx) {
    const P = ctx.P;
    if (D <= P.L) { const pc = obtainSingle(D, ctx); return { pieces: [pc], firstSeam: null }; }
    const okOff = S => prevSeam == null || (Math.abs(S - prevSeam) >= P.minOff - 1e-9 && Math.abs(S - prevSeam) <= P.maxOff + 1e-9);
    let best = null;
    if (D % P.L === 0 && okOff(P.L)) best = { kind: 'allWhole', boards: D / P.L, waste: 0, cuts: 0, reuse: 0 };
    const sLo = P.minCut, sHi = Math.min(P.L, D);
    if (sLo <= sHi) { const cand = pickS(sLo, sHi, D, prevSeam, ctx); if (cand && (!best || better(cand, best))) best = cand; }
    if (!best && sLo <= sHi) { const cand = pickS(sLo, sHi, D, null, ctx); if (cand && (!best || better(cand, best))) best = cand; }
    if (!best) {
        const n = Math.ceil(D / P.L);
        const pieces = [];
        for (let i = 0; i < n; i++) pieces.push({ len: P.L, src: 'whole', lockL: 'S', lockR: 'E' });
        ctx.wholeUsed += n;
        return { pieces, firstSeam: P.L };
    }
    const pieces = [];
    let firstSeam = P.L;
    if (best.kind === 'allWhole') {
        const n = D / P.L;
        for (let i = 0; i < n; i++) pieces.push({ len: P.L, src: 'whole', lockL: 'S', lockR: 'E' });
        ctx.wholeUsed += n;
    } else {
        const s = best.s;
        const rem = D - s;
        const n = Math.floor(rem / P.L + 1e-9);
        const e = Math.round(rem - n * P.L);
        if (s === P.L) { pieces.push({ len: P.L, src: 'whole', lockL: 'S', lockR: 'E' }); ctx.wholeUsed++; }
        else pieces.push(takeCut('start', s, best.startSrc, ctx));
        for (let i = 0; i < n; i++) { pieces.push({ len: P.L, src: 'whole', lockL: 'S', lockR: 'E' }); ctx.wholeUsed++; }
        if (e > 0) {
            if (e === P.L) { pieces.push({ len: P.L, src: 'whole', lockL: 'S', lockR: 'E' }); ctx.wholeUsed++; }
            else pieces.push(takeCut('end', e, best.endSrc, ctx));
        }
        firstSeam = s;
    }
    return { pieces, firstSeam };
}

function obtainSingle(D, ctx) {
    const P = ctx.P;
    const cands = [];
    for (const p of ctx.db.none) if (p.len >= D) cands.push({ p, db: 'none' });
    for (const p of ctx.db.start) if (p.len >= D) cands.push({ p, db: 'start' });
    for (const p of ctx.db.end) if (p.len >= D) cands.push({ p, db: 'end' });
    const prio = { none: 0, start: 1, end: 1 };
    cands.sort((a, b) => b.p.len - a.p.len || prio[a.db] - prio[b.db]);
    if (cands.length) {
        const c = cands[0], list = ctx.db[c.db];
        list.splice(list.indexOf(c.p), 1);
        const rem = c.p.len - D;
        if (rem > 0) pushRemnant(ctx, 'none', rem);
        ctx.reused++;
        const lbl = c.db === 'start' ? 'нач. замок' : c.db === 'end' ? 'кон. замок' : 'без замков';
        return { len: D, src: 'reuse', from: c.p.len, dbLabel: lbl, forced: D < P.minCut, lockL: null, lockR: null };
    }
    ctx.wholeUsed++;
    const rem = P.L - D;
    if (rem > 0) {
        if (rem >= P.minCut) ctx.db.none.push({ id: ctx.nextId++, len: rem });
        else { ctx.wasteCount++; ctx.wasteLen += rem; }
    }
    if (rem > 0) ctx.cutNew++;
    if (rem === 0) return { len: D, src: 'whole', forced: false, lockL: 'S', lockR: 'E' };
    return { len: D, src: 'cut', forced: D < P.minCut, lockL: null, lockR: null };
}

function better(a, b) {
    if (a.boards !== b.boards) return a.boards < b.boards;
    if (a.waste !== b.waste) return a.waste < b.waste;
    if (a.cuts !== b.cuts) return a.cuts < b.cuts;
    return a.reuse > b.reuse;
}

function takeCut(pos, len, src, ctx) {
    const P = ctx.P;
    if (src && src.type === 'db') {
        const listName = pos === 'start' ? 'end' : 'start';
        const list = ctx.db[listName], idx = list.indexOf(src.piece);
        if (idx >= 0) {
            list.splice(idx, 1);
            const rem = src.piece.len - len;
            if (rem > 0) pushRemnant(ctx, 'none', rem);
            ctx.reused++;
            return { len, src: 'reuse', from: src.piece.len, dbLabel: listName === 'end' ? 'кон. замок' : 'нач. замок', forced: len < P.minCut, lockL: pos === 'start' ? null : 'S', lockR: pos === 'start' ? 'E' : null };
        }
    }
    ctx.wholeUsed++; ctx.cutNew++;
    const rem = P.L - len, type = pos === 'start' ? 'start' : 'end';
    if (rem > 0) pushRemnant(ctx, type, rem);
    return { len, src: 'cut', forced: len < P.minCut, lockL: pos === 'start' ? null : 'S', lockR: pos === 'start' ? 'E' : null };
}

function pushRemnant(ctx, type, len) {
    if (len <= 0) return;
    if (len >= ctx.P.minCut) ctx.db[type].push({ id: ctx.nextId++, len });
    else { ctx.wasteCount++; ctx.wasteLen += len; }
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function updateUI() { const res = state.result; $('boardsBadge').textContent = (res ? res.totalBoards : '—') + ' досок'; $('dirNote').textContent = state.orientation === 'vert' ? 'Вертикальная ориентация: стена повёрнута на 90°, «снизу» = справа.' : ''; renderWallList(); renderSummary(); renderDb(); renderDetails(); draw(); }

<script>
'use strict';
var current = 'editor';

function buildFrame(tplId, frameId) {
  var html = document.getElementById(tplId).textContent.replace(/<\\\/script>/gi, '<' + '/script>');
  document.getElementById(frameId).srcdoc = html;
}

function render() {
  var fe = document.getElementById('frame-editor');
  var fc = document.getElementById('frame-calc');
  var btn = document.getElementById('btnSwitch');
  var cur = document.getElementById('curLabel');
  if (current === 'editor') {
    fe.classList.add('show'); fc.classList.remove('show');
    cur.textContent = '🧱 Редактор стен';
    btn.textContent = '📐';
    btn.title = 'Перейти в калькулятор';
  } else {
    fc.classList.add('show'); fe.classList.remove('show');
    cur.textContent = '📐 Калькулятор';
    btn.textContent = '🧱';
    btn.title = 'Перейти в редактор стен';
  }
}

document.getElementById('btnSwitch').addEventListener('click', function () {
  current = (current === 'editor') ? 'calc' : 'editor';
  render();
});

buildFrame('tpl-editor', 'frame-editor');
buildFrame('tpl-calc', 'frame-calc');
render();
</script>
